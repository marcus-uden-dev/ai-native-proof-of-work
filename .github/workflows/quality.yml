name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PUBLIC_RELEASE_FORBIDDEN_IDENTITIES: ${{ secrets.PUBLIC_RELEASE_FORBIDDEN_IDENTITIES }}
  PUBLIC_RELEASE_FORBIDDEN_ANCESTORS: ${{ secrets.PUBLIC_RELEASE_FORBIDDEN_ANCESTORS }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full clean history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit development dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run contract and browser tests
        run: npm test
      - name: Validate the public release boundary
        run: npm run release:validate
      - name: Check whitespace errors
        run: git diff --check

