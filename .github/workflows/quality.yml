name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PUBLIC_RELEASE_FORBIDDEN_IDENTITIES: ${{ secrets.PUBLIC_RELEASE_FORBIDDEN_IDENTITIES }}
  PUBLIC_RELEASE_FORBIDDEN_ANCESTORS: ${{ secrets.PUBLIC_RELEASE_FORBIDDEN_ANCESTORS }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full clean history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Complete shallow history before ancestry validation
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --no-tags origin
          fi
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit development dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run contract and browser tests
        run: npm test
      - name: Inspect ancestry before release validation
        run: |
          echo "Shallow: $(git rev-parse --is-shallow-repository)"
          echo "Git directory: $(git rev-parse --git-dir)"
          echo "Replace refs: $(git replace -l | tr '\n' ' ')"
          echo "Main parent: $(git show -s --format=%P origin/main)"
          echo "Main traversal: $(git rev-list --parents -1 origin/main)"
          echo "Head roots: $(git rev-list --max-parents=0 HEAD | tr '\n' ' ')"
      - name: Validate the public release boundary
        run: npm run release:validate
      - name: Check whitespace errors
        run: git diff --check

